name: release

# Push a tag like v1.0.3 and this builds, checks, tests, signs through the AMO
# API and attaches the signed XPI to a GitHub Release. The credentials live in
# repository secrets, so they never touch a developer machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without signing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Refuse a tag that disagrees with the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(node -p "require('./src/manifest.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $tag does not match manifest version $manifest"
            exit 1
          fi

      - name: Check and test
        run: |
          node tools/check.mjs
          node --test

      - name: Lint as addons.mozilla.org will
        run: npx --yes web-ext@latest lint --source-dir=src --self-hosted

      - name: Benchmark the request hot path
        run: node tools/bench.mjs

      # Re-pushing an existing tag would otherwise retry a version AMO already
      # holds, which always fails. Nothing to do is not a failure.
      - name: Skip a version that is already released
        id: released
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME is already released; nothing to sign"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # A mistyped secret otherwise surfaces at the signing step, which is after
      # the tag exists. Ask AMO who we are first; it publishes nothing.
      - name: Check the AMO credentials
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node tools/check-amo-credentials.mjs

      - name: Sign through the AMO API
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run && steps.released.outputs.already != 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx --yes web-ext@latest sign --source-dir=src --channel=unlisted --artifacts-dir=dist

      - name: Fall back to an unsigned archive
        if: "!startsWith(github.ref, 'refs/tags/v') || inputs.dry_run"
        run: node tools/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: zagent-${{ github.ref_name }}
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run && steps.released.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

      # Firefox polls updates.json to discover new versions. AMO does not serve
      # that for unlisted add-ons, so the release has to publish it itself.
      - name: Point the update manifest at this release
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run && steps.released.outputs.already != 'true'
        run: |
          xpi=$(ls dist/*.xpi | head -1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$xpi")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main

          node tools/update-manifest.mjs "${GITHUB_REF_NAME#v}" "$xpi" "$url"
          git add updates.json
          git commit -m "Offer ${GITHUB_REF_NAME} to installed copies"
          git push origin main
