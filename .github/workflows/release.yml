name: release

# Push a tag like v1.0.3 and this builds, checks, tests, signs through the AMO
# API and attaches the signed XPI to a GitHub Release. The credentials live in
# repository secrets, so they never touch a developer machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without signing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Refuse a tag that disagrees with the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(node -p "require('./src/manifest.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $tag does not match manifest version $manifest"
            exit 1
          fi

      - name: Check and test
        run: |
          node tools/check.mjs
          node --test

      - name: Lint as addons.mozilla.org will
        run: npx --yes web-ext@latest lint --source-dir=src --self-hosted

      - name: Benchmark the request hot path
        run: node tools/bench.mjs

      - name: Sign through the AMO API
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx --yes web-ext@latest sign --source-dir=src --channel=unlisted --artifacts-dir=dist

      - name: Fall back to an unsigned archive
        if: "!startsWith(github.ref, 'refs/tags/v') || inputs.dry_run"
        run: node tools/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: zagent-${{ github.ref_name }}
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
